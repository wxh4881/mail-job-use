<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>集包码面单批量生成 · 快递单模式</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;padding:20px 20px 32px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#f4f6fa;color:#1f2937;-webkit-font-smoothing:antialiased;
  }
  .app{max-width:1440px;margin:0 auto}

  header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:21px;margin:0 0 4px}
  .sub{margin:0;color:#6b7280;font-size:13px;line-height:1.6}

  .mode-switch{display:inline-flex;background:#e9eef7;border-radius:10px;padding:3px;gap:3px;flex:0 0 auto}
  .mode-btn{
    font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;border:none;
    background:transparent;color:#5b6472;cursor:pointer;transition:.15s;font-family:inherit;
  }
  .mode-btn.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 3px rgba(15,23,42,.12)}

  .workspace{display:flex;gap:18px;align-items:flex-start}

  /* ============ 左侧设置 ============ */
  .settings{
    flex:0 0 390px;
    background:#fff;border:1px solid #e3e8f0;border-radius:14px;
    padding:18px;display:flex;flex-direction:column;gap:16px;
    max-height:calc(100vh - 120px);overflow-y:auto;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .panel{display:flex;flex-direction:column;gap:14px}
  .panel[hidden]{display:none!important}

  /* 快递单内部子标签 */
  .sub-tabs{display:inline-flex;background:#eef1f7;border-radius:9px;padding:3px;gap:3px;align-self:flex-start}
  .sub-tab{
    font-size:13px;font-weight:600;padding:7px 18px;border-radius:7px;border:none;
    background:transparent;color:#5b6472;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .sub-tab:hover{color:#1d4ed8}
  .sub-tab.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 3px rgba(15,23,42,.12)}

  .sub-panel{display:flex;flex-direction:column;gap:14px}
  .sub-panel[hidden]{display:none!important}

  .group{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px dashed #e8edf5}
  .group:last-of-type{border-bottom:none;padding-bottom:0}
  .group-title{font-size:11px;font-weight:800;color:#8a93a3;letter-spacing:.08em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#4b5563;font-weight:600;min-width:0}
  .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  textarea,input[type=text],input[type=number],select{
    font-family:inherit;font-size:13px;padding:8px 10px;width:100%;
    border:1px solid #d7dee9;border-radius:8px;outline:none;
    background:#fbfcfe;color:#111827;transition:border-color .15s,box-shadow .15s,background .15s;
  }
  textarea:focus,input[type=text]:focus,input[type=number]:focus,select:focus{
    border-color:#2563eb;background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12);
  }
  textarea{resize:vertical;line-height:1.55;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
  select{cursor:pointer}
  input[type=number]:disabled{background:#f1f3f7;color:#9aa3b2;cursor:not-allowed}
  .checkbox{display:flex;flex-direction:row;align-items:center;gap:8px;font-size:13px;font-weight:500;color:#374151;cursor:pointer;user-select:none}
  .checkbox input{width:16px;height:16px;accent-color:#2563eb;cursor:pointer;flex:0 0 auto}

  .hint{font-size:11px;color:#9aa3b2;line-height:1.5;font-weight:400}

  .warn{
    font-size:12px;line-height:1.6;color:#b45309;background:#fffbeb;
    border:1px solid #fde68a;border-radius:8px;padding:8px 10px;
  }
  .warn[hidden]{display:none}

  .actions{display:flex;gap:10px;flex-wrap:wrap;position:sticky;bottom:-18px;background:#fff;padding-top:6px}
  button{
    font-family:inherit;font-size:13px;font-weight:600;
    padding:9px 18px;border-radius:9px;border:1px solid transparent;
    cursor:pointer;transition:.15s;
  }
  button.accent{background:#0d9488;color:#fff;box-shadow:0 1px 2px rgba(13,148,136,.3)}
  button.accent:hover{background:#0f766e}
  button.download{background:#4f46e5;color:#fff;box-shadow:0 1px 2px rgba(79,70,229,.3)}
  button.download:hover{background:#4338ca}
  button.ghost{background:#fff;border-color:#d7dee9;color:#374151}
  button.ghost:hover{background:#f3f6fb}
  button:disabled{opacity:.6;cursor:not-allowed}

  /* 面单页标签栏 */
  .page-tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    scrollbar-width:thin;
  }
  .page-tabs::-webkit-scrollbar{height:6px}
  .page-tabs::-webkit-scrollbar-thumb{background:#cfd8e6;border-radius:3px}
  .page-tab{
    flex:0 0 auto;
    padding:6px 12px;
    font-size:12px;
    font-weight:600;
    border-radius:7px;
    border:1px solid #dfe5f0;
    background:#fbfcff;
    color:#5b6472;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
    white-space:nowrap;
  }
  .page-tab:hover{background:#eef2ff;border-color:#b9c6e8;color:#1d4ed8}
  .page-tab.active{background:#4338ca;border-color:#4338ca;color:#fff}
  .page-tab-add{
    flex:0 0 auto;
    padding:6px 12px;
    font-size:13px;
    font-weight:700;
    border-radius:7px;
    border:1px dashed #b9c6e8;
    background:#eef2ff;
    color:#1d4ed8;
    cursor:pointer;
    font-family:inherit;
    transition:.15s;
  }
  .page-tab-add:hover{background:#e0e7ff}

  .page-editor{
    border:1px solid #dfe5f0;
    border-radius:10px;
    padding:12px;
    background:#fbfcff;
    display:flex;
    flex-direction:column;
    gap:9px;
  }
  .page-editor-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .epc-title{font-size:12px;font-weight:800;color:#4338ca}
  .epc-del{
    padding:4px 10px;font-size:11px;border-radius:6px;border:1px solid #fecaca;
    background:#fff;color:#b91c1c;cursor:pointer;
  }
  .epc-del:hover{background:#fef2f2}
  .epc-del:disabled{opacity:.4;cursor:not-allowed;background:#f8fafc;color:#9aa3b2;border-color:#e2e8f0}

  /* 高级选项折叠框 */
  .adv-box{
    border:1px dashed #dbe3ef;border-radius:9px;padding:9px 11px;background:#f8fafc;
  }
  .adv-box summary{
    cursor:pointer;font-size:12px;font-weight:700;color:#4b5563;
    list-style:none;outline:none;user-select:none;
  }
  .adv-box summary::-webkit-details-marker{display:none}
  .adv-box summary::before{content:'▸ ';color:#8a93a3}
  .adv-box[open] summary::before{content:'▾ '}
  .adv-body{margin-top:10px;display:flex;flex-direction:column;gap:9px}

  .save-note{
    display:flex;align-items:center;gap:6px;
    font-size:11px;color:#8a93a3;line-height:1.5;
  }
  .save-dot{width:6px;height:6px;border-radius:50%;background:#10b981;flex:0 0 auto}
  .save-dot.pending{background:#f59e0b}

  /* ============ 右侧预览 ============ */
  .preview-pane{
    flex:1 1 auto;min-width:0;background:#fff;border:1px solid #e3e8f0;
    border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .preview-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:10px 14px;border-bottom:1px solid #eef1f6;font-size:13px;color:#4b5563;
  }
  .preview-bar b{color:#111827}
  .preview-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .view-switch{display:inline-flex;background:#eef1f7;border-radius:8px;padding:2px;gap:2px}
  .view-switch[hidden]{display:none!important}
  .view-btn{
    font-size:12px;font-weight:600;padding:6px 12px;border-radius:6px;border:none;
    background:transparent;color:#5b6472;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .view-btn:hover{color:#1d4ed8}
  .view-btn.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 2px rgba(15,23,42,.1)}

  .zoom-ctl{display:flex;align-items:center;gap:8px;font-size:12px;color:#6b7280}
  .zoom-ctl input[type=range]{width:120px;accent-color:#2563eb;cursor:pointer}
  .zoom-val{min-width:42px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#374151}

  .preview-scroll{
    background:#eef1f7;padding:24px;
    height:calc(100vh - 160px);min-height:420px;overflow:auto;
  }
  .pages{display:flex;flex-direction:column;align-items:center;gap:26px}
  .paper-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .paper-cap{font-size:11px;color:#8a93a3;font-variant-numeric:tabular-nums}
  .paper{
    position:relative;background:#fff;overflow:hidden;
    box-shadow:0 2px 12px rgba(15,23,42,.14);
    outline:1px solid rgba(15,23,42,.06);
  }
  .guide-top{
    position:absolute;top:0;left:0;right:0;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;color:#8b95ff;letter-spacing:.04em;overflow:hidden;
    background:repeating-linear-gradient(45deg,#f6f8ff,#f6f8ff 6px,#edf1ff 6px,#edf1ff 12px);
    border-bottom:1px dashed #c7d2fe;pointer-events:none;
  }
  .paper-body{
    display:flex;flex-direction:column;height:100%;
    justify-content:flex-start;
  }
  .paper-item{
    position:relative;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .paper-item svg{display:block}
  .paper-err{font-size:11px;color:#b91c1c;padding:0 4px;text-align:center}
  .dl-btn{
    position:absolute;top:1px;right:1px;opacity:0;pointer-events:none;
    font-size:10px;padding:2px 6px;border-radius:5px;border:1px solid #c7d2fe;
    background:#fff;color:#4338ca;cursor:pointer;transition:opacity .12s;
  }
  .paper-item:hover .dl-btn{opacity:1;pointer-events:auto}
  .empty-tip{color:#9ca3af;font-size:13px;text-align:center;padding:60px 20px}
  .page-more{
    font-size:12px;color:#6b7280;background:#fff;border:1px dashed #cfd8e6;
    border-radius:9px;padding:10px 18px;text-align:center;
  }

  .single-nav{
    display:flex;align-items:center;gap:12px;
    background:#fff;border:1px solid #e3e8f0;border-radius:10px;
    padding:6px 10px;box-shadow:0 1px 2px rgba(16,24,40,.05);
  }
  .single-nav button{
    width:36px;height:32px;border-radius:7px;border:1px solid #d7dee9;
    background:#fff;color:#374151;font-size:17px;line-height:1;cursor:pointer;
    padding:0;display:flex;align-items:center;justify-content:center;
  }
  .single-nav button:hover:not(:disabled){background:#eef2ff;border-color:#b9c6e8;color:#1d4ed8}
  .single-nav button:disabled{opacity:.35;cursor:not-allowed}
  .single-nav .counter{
    font-size:12px;color:#4b5563;font-variant-numeric:tabular-nums;
    min-width:96px;text-align:center;font-weight:600;
  }

  /* 快递单预览结构 */
  .express-body{display:flex;flex-direction:column;height:100%}
  .express-top-barcode{display:flex;justify-content:center;align-items:center;flex:0 0 auto;overflow:hidden}
  .express-top-barcode svg{display:block}
  .express-main{display:flex;flex:1;min-height:0}
  .express-content{
    flex:1;min-width:0;white-space:pre-wrap;word-break:break-all;overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    color:#111827;
  }
  .express-vbarcode{flex:0 0 auto;display:flex;align-items:flex-start;overflow:hidden;align-self:flex-start}
  .express-vbarcode svg{display:block}
  .express-err{font-size:11px;color:#b91c1c;padding:4px;text-align:center;width:100%}

  /* ============ 打印输出 ============ */
  .print-root{display:none}

  @media print{
    @page{size:76mm 130mm;margin:0}
    html,body{
      margin:0!important;padding:0!important;height:auto!important;
      background:#fff!important;
      -webkit-print-color-adjust:exact;print-color-adjust:exact;
    }
    .app{display:none!important}
    .print-root{display:block!important}

    .label-page{
      width:76mm;height:129.8mm;
      overflow:hidden;
      page-break-after:always;break-after:page;
      page-break-inside:avoid;break-inside:avoid;
    }
    .label-page:last-child{page-break-after:auto;break-after:auto}
    .label-body{
      height:129.8mm;box-sizing:border-box;
      display:flex;flex-direction:column;justify-content:flex-start;
      overflow:hidden;
    }
    .label-item{
      flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;
    }
    .label-item svg{display:block}
    .print-err{color:#b91c1c;font-size:8pt;padding:1mm;text-align:center}

    .express-label{
      height:129.8mm;box-sizing:border-box;overflow:hidden;
      display:flex;flex-direction:column;
    }
    .express-label .express-body{height:100%}
    .express-label .express-content{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  }

  @media (max-width:1000px){
    .workspace{flex-direction:column}
    .settings{flex:1 1 auto;width:100%;max-height:none}
    .preview-pane{width:100%}
    .preview-scroll{height:auto;max-height:none}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>集包码面单批量生成</h1>
      <p class="sub">普通模式：一页多个条码 / 单条翻阅 · 快递单模式：内容与设置分开编辑 · 所有设置自动保存在本地</p>
    </div>
    <div class="mode-switch">
      <button id="modeNormal" class="mode-btn active" type="button">普通模式</button>
      <button id="modeExpress" class="mode-btn" type="button">快递单模式</button>
    </div>
  </header>

  <div class="workspace">
    <!-- ========== 左：设置 ========== -->
    <aside class="settings" id="settings">
      <!-- 普通模式面板 -->
      <div class="panel" id="normalPanel">
        <div class="group">
          <label class="field">
            <span class="lbl">条码内容（每行一个，最多 300 行）</span>
            <textarea id="input" rows="7" spellcheck="false" placeholder="每行一个条码内容，例如：&#10;JB202410310001&#10;JB202410310002"></textarea>
          </label>
        </div>

        <div class="group">
          <div class="group-title">条码布局</div>
          <div class="grid2">
            <label class="field">
              <span class="lbl">每张面单条码数</span>
              <input type="number" id="perPage" value="6" min="1" max="20" step="1">
            </label>
            <label class="field">
              <span class="lbl">条码宽度占比 (%)</span>
              <input type="number" id="widthPct" value="100" min="20" max="100" step="1">
            </label>
          </div>
          <div class="grid2">
            <label class="field">
              <span class="lbl">高度模式</span>
              <select id="heightMode">
                <option value="auto" selected>自动铺满</option>
                <option value="fixed">固定高度</option>
              </select>
            </label>
            <label class="field">
              <span class="lbl">条码高度 (mm)</span>
              <input type="number" id="fixedHeight" value="22" min="3" max="120" step="0.5" disabled>
            </label>
          </div>
          <label class="field">
            <span class="lbl">单条翻阅条码高度 (mm)</span>
            <input type="number" id="singleBarH" value="22" min="3" max="120" step="0.5">
            <span class="hint">仅“单条翻阅”预览生效，默认 22mm</span>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="showText" checked>
            <span>条码下方显示文本</span>
          </label>
        </div>

        <div class="group">
          <div class="group-title">面单留白与间距（毫米，与快递单共用）</div>
          <div class="grid2">
            <label class="field">
              <span class="lbl">上边距（图标区）</span>
              <input type="number" id="padTop" value="10" min="0" max="80" step="0.5">
            </label>
            <label class="field">
              <span class="lbl">下边距</span>
              <input type="number" id="padBottom" value="3" min="0" max="80" step="0.5">
            </label>
            <label class="field">
              <span class="lbl">左边距</span>
              <input type="number" id="padLeft" value="2" min="0" max="40" step="0.5">
            </label>
            <label class="field">
              <span class="lbl">右边距</span>
              <input type="number" id="padRight" value="2" min="0" max="40" step="0.5">
            </label>
            <label class="field">
              <span class="lbl">条码间距</span>
              <input type="number" id="gap" value="1.5" min="0" max="40" step="0.5">
            </label>
          </div>
        </div>

        <div id="warn" class="warn" hidden></div>

        <div class="actions">
          <button id="printAll" class="accent" type="button">一键打印面单</button>
          <button id="downloadZip" class="download" type="button">一键下载条码 ZIP</button>
          <button id="reset" class="ghost" type="button">恢复默认</button>
        </div>
      </div>

      <!-- 快递单模式面板 -->
      <div class="panel" id="expressPanel" hidden>
        <!-- 子标签：内容 / 设置 -->
        <div class="sub-tabs" id="expressSubTabs">
          <button type="button" class="sub-tab active" data-subtab="content">内容</button>
          <button type="button" class="sub-tab" data-subtab="settings">设置</button>
        </div>

        <!-- 子面板：内容 -->
        <div class="sub-panel" id="expressContentPanel">
          <div class="group">
            <div class="group-title">面单页（点击标签切换编辑）</div>
            <div class="page-tabs" id="pageTabs"></div>
            <div class="page-editor" id="pageEditor"></div>
            <details class="adv-box" id="advBox">
              <summary>高级选项：单独设置纵向条码内容</summary>
              <div class="adv-body" id="advBody"></div>
            </details>
          </div>
        </div>

        <!-- 子面板：设置 -->
        <div class="sub-panel" id="expressSettingsPanel" hidden>
          <div class="group">
            <div class="group-title">快递单条码布局</div>
            <div class="grid2">
              <label class="field">
                <span class="lbl">横条码高度 (mm)</span>
                <input type="number" id="exBarH" value="12" min="4" max="60" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">横条码宽度占比 (%)</span>
                <input type="number" id="exWidthPct" value="100" min="30" max="100" step="1">
              </label>
            </div>
            <label class="checkbox">
              <input type="checkbox" id="exShowText" checked>
              <span>横条码显示文本</span>
            </label>
            <div class="grid2">
              <label class="checkbox">
                <input type="checkbox" id="exShowVBarcode" checked>
                <span>显示竖条码</span>
              </label>
              <label class="checkbox" id="exVTextWrap">
                <input type="checkbox" id="exShowVText" checked>
                <span>竖条码显示文本</span>
              </label>
            </div>
            <div class="grid2">
              <label class="field">
                <span class="lbl">竖条码宽度 (mm，不含文字)</span>
                <input type="number" id="exVBarW" value="12" min="6" max="36" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">竖条码上边距 (mm)</span>
                <input type="number" id="exVBarTop" value="0" min="0" max="60" step="0.5">
              </label>
            </div>
            <label class="field">
              <span class="lbl">竖条码长度 (mm，0 = 自动铺满剩余高度)</span>
              <input type="number" id="exVBarH" value="0" min="0" max="120" step="0.5">
            </label>
          </div>

          <div class="group">
            <div class="group-title">面单留白与间距（毫米，与普通模式共用）</div>
            <div class="grid2">
              <label class="field">
                <span class="lbl">上边距（图标区）</span>
                <input type="number" id="exPadTop" value="10" min="0" max="80" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">下边距</span>
                <input type="number" id="exPadBottom" value="3" min="0" max="80" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">左边距</span>
                <input type="number" id="exPadLeft" value="2" min="0" max="40" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">右边距</span>
                <input type="number" id="exPadRight" value="2" min="0" max="40" step="0.5">
              </label>
              <label class="field">
                <span class="lbl">间距</span>
                <input type="number" id="exGap" value="1.5" min="0" max="40" step="0.5">
              </label>
            </div>
          </div>
        </div>

  function normalizeState(s) {
    if (!s || typeof s !== 'object') return false;
    const n = Object.assign({}, DEFAULT_NORMAL, s.normal || {});

    x.currentPage = Math.max(0, Math.min(x.pages.length - 1, parseInt(x.currentPage, 10) || 0));

    state.normal = n;
    state.express = x;

    try {
      const old = localStorage.getItem(STORAGE_KEY_V1);

          input: typeof o.input === 'string' ? o.input : DEFAULT_NORMAL.input,

  /* ================= Code128 值序列 ================= */
  function code128Values(text) {
    if (!text.length) throw new Error('内容为空');
    for (const ch of text) {
      const c = ch.charCodeAt(0);
      if (c < 32 || c > 126) throw new Error('含不支持的字符「' + ch + '」，仅支持 ASCII 可见字符');
    }
    const values = [];
    if (/^\d+$/.test(text) && text.length % 2 === 0) {
      values.push(START_C);
      for (let i = 0; i < text.length; i += 2) {
        values.push(parseInt(text.slice(i, i + 2), 10));
      }
    } else {
      values.push(START_B);
      for (const ch of text) values.push(ch.charCodeAt(0) - 32);
    }
    let sum = values[0];
    for (let i = 1; i < values.length; i++) sum += values[i] * i;
    values.push(sum % 103);
    values.push(STOP);
    return values;
  }

  function code128Runs(text) {
    const values = code128Values(text);
    const runs = [];
    let x = 0;
    for (let i = 0; i < values.length; i++) {
      const pattern = CODE128[values[i]];
      let isBar = true;
      for (let k = 0; k < pattern.length; k++) {
        const w = pattern.charCodeAt(k) - 48;
        if (isBar) runs.push([x, w]);
        x += w;
        isBar = !isBar;
      }
    }
    return { runs: runs, totalModules: x };
  }

  /* ================= 横向 SVG ================= */
  function buildSVG(text, width, barHeight, textHeight, fontSize, unit) {
    const info = code128Runs(text);
    const runs = info.runs;
    const quiet = 10;
    const totalModules = info.totalModules + quiet * 2;
    const mw = width / totalModules;
    const totalH = barHeight + textHeight;
    const u = unit || '';

    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('xmlns', SVGNS);
    svg.setAttribute('width', width + u);
    svg.setAttribute('height', totalH + u);
    svg.setAttribute('viewBox', '0 0 ' + width + ' ' + totalH);

    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', 0);
    bg.setAttribute('y', 0);
    bg.setAttribute('width', width);
    bg.setAttribute('height', totalH);
    bg.setAttribute('fill', '#ffffff');
    svg.appendChild(bg);

    for (let i = 0; i < runs.length; i++) {
      const rect = document.createElementNS(SVGNS, 'rect');
      rect.setAttribute('x', ((runs[i][0] + quiet) * mw).toFixed(4));
      rect.setAttribute('y', 0);
      rect.setAttribute('width', (runs[i][1] * mw).toFixed(4));
      rect.setAttribute('height', barHeight);
      rect.setAttribute('fill', '#000000');
      svg.appendChild(rect);
    }

    if (textHeight > 0 && fontSize > 0) {
      const t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', width / 2);
      t.setAttribute('y', (barHeight + textHeight / 2 + fontSize * 0.35).toFixed(3));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('font-family', "ui-monospace, 'Courier New', monospace");
      t.setAttribute('font-size', fontSize.toFixed(3));
      t.setAttribute('fill', '#000000');
      t.textContent = text;
      svg.appendChild(t);
    }

    return svg;
  }

  /* ================= 竖向 SVG ================= */
  function buildVerticalSVG(text, barcodeW, height, textW, fontSize, showText, unit) {
    const info = code128Runs(text);
    const runs = info.runs;
    const quiet = 10;
    const totalModules = info.totalModules + quiet * 2;
    const mh = height / totalModules;
    const show = !!showText && textW > 0 && fontSize > 0;
    const offsetX = show ? textW : 0;
    const totalW = barcodeW + offsetX;
    const u = unit || '';

    const svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('xmlns', SVGNS);
    svg.setAttribute('width', totalW + u);
    svg.setAttribute('height', height + u);
    svg.setAttribute('viewBox', '0 0 ' + totalW + ' ' + height);

    const bg = document.createElementNS(SVGNS, 'rect');
    bg.setAttribute('x', 0);
    bg.setAttribute('y', 0);
    bg.setAttribute('width', totalW);
    bg.setAttribute('height', height);
    bg.setAttribute('fill', '#ffffff');
    svg.appendChild(bg);

    for (let i = 0; i < runs.length; i++) {
      const rect = document.createElementNS(SVGNS, 'rect');
      rect.setAttribute('x', offsetX);
      rect.setAttribute('y', ((runs[i][0] + quiet) * mh).toFixed(4));
      rect.setAttribute('width', barcodeW);
      rect.setAttribute('height', (runs[i][1] * mh).toFixed(4));
      rect.setAttribute('fill', '#000000');
      svg.appendChild(rect);
    }

    if (show) {
      const cx = textW / 2;
      const cy = height / 2;
      const t = document.createElementNS(SVGNS, 'text');
      t.setAttribute('x', cx.toFixed(3));
      t.setAttribute('y', cy.toFixed(3));
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('dominant-baseline', 'central');
      t.setAttribute('transform', 'rotate(-90 ' + cx.toFixed(3) + ' ' + cy.toFixed(3) + ')');
      t.setAttribute('font-family', "ui-monospace, 'Courier New', monospace");
      t.setAttribute('font-size', fontSize.toFixed(3));
      t.setAttribute('fill', '#000000');
      t.textContent = text;
      svg.appendChild(t);
    }

    return svg;
  }

  /* ================= 导出 PNG（单条） ================= */
  function downloadPNG(svg, name) {
    const w = parseFloat(svg.getAttribute('width'));
    const h = parseFloat(svg.getAttribute('height'));
    const svgString = new XMLSerializer().serializeToString(svg.cloneNode(true));
    const blob = new Blob(['<?xml version="1.0" standalone="no"?>\n' + svgString],
                          { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const img = new Image();

    img.onload = function () {
      const scale = Math.max(1, 900 / w);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(w * scale);
      canvas.height = Math.round(h * scale);
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);

      canvas.toBlob(function (b) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = (String(name).replace(/[\\/:*?"<>|]/g, '_') || 'barcode') + '.png';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      }, 'image/png');
    };
    img.onerror = function () {
      URL.revokeObjectURL(url);
      alert('导出 PNG 失败，请重试');
    };
    img.src = url;
  }

  /* ================= SVG → PNG Blob ================= */
  function svgToPngBlob(svg, width, height) {
    return new Promise(function (resolve, reject) {
      const svgString = new XMLSerializer().serializeToString(svg);
      const blob = new Blob(['<?xml version="1.0" standalone="no"?>\n' + svgString],
                            { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const img = new Image();

      img.onload = function () {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);
          canvas.toBlob(function (b) {
            if (b) resolve(b);
            else reject(new Error('PNG 生成失败'));
          }, 'image/png');
        } catch (e) {
          URL.revokeObjectURL(url);
          reject(e);
        }
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error('条码渲染失败'));
      };
      img.src = url;
    });
  }

  /* ================= 极简 ZIP 打包（Store 模式） ================= */
  const CRC_TABLE = (function () {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) {
        c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      }
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) {
      c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    }
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function buildZip(files) {
    const enc = new TextEncoder();
    const parts = [];
    const central = [];
    let offset = 0;

    files.forEach(function (f) {
      const nameBytes = enc.encode(f.name);
      const data = f.data;
      const size = data.length;
      const crc = crc32(data);

      const lh = new Uint8Array(30 + nameBytes.length);
      const ldv = new DataView(lh.buffer);
      ldv.setUint32(0, 0x04034b50, true);
      ldv.setUint16(4, 20, true);
      ldv.setUint16(6, 0x0800, true);
      ldv.setUint16(8, 0, true);
      ldv.setUint16(10, 0, true);
      ldv.setUint16(12, 0x21, true);
      ldv.setUint32(14, crc, true);
      ldv.setUint32(18, size, true);
      ldv.setUint32(22, size, true);
      ldv.setUint16(26, nameBytes.length, true);
      ldv.setUint16(28, 0, true);
      lh.set(nameBytes, 30);
      parts.push(lh, data);

      const ch = new Uint8Array(46 + nameBytes.length);
      const cdv = new DataView(ch.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true);
      cdv.setUint16(10, 0, true);
      cdv.setUint16(12, 0, true);
      cdv.setUint16(14, 0x21, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, nameBytes.length, true);
      cdv.setUint16(30, 0, true);
      cdv.setUint16(32, 0, true);
      cdv.setUint16(34, 0, true);
      cdv.setUint16(36, 0, true);
      cdv.setUint32(38, 0, true);
      cdv.setUint32(42, offset, true);
      ch.set(nameBytes, 46);
      central.push(ch);

      offset += lh.length + size;
    });

    let centralSize = 0;
    central.forEach(function (c) { centralSize += c.length; });

    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(4, 0, true);
    edv.setUint16(6, 0, true);
    edv.setUint16(8, files.length, true);
    edv.setUint16(10, files.length, true);
    edv.setUint32(12, centralSize, true);
    edv.setUint32(16, offset, true);
    edv.setUint16(20, 0, true);

    return new Blob(parts.concat(central, [eocd]), { type: 'application/zip' });
  }

  /* ================= 文件名工具 ================= */
  function padSeq(n) {
    return n < 10 ? '00' + n : n < 100 ? '0' + n : '' + n;
  }
  function safeFileName(s) {
    let name = String(s).replace(/[\\/:*?"<>|\x00-\x1F]/g, '_').trim();
    if (!name) name = 'barcode';
    if (name.length > 80) name = name.slice(0, 80);
    return name;
  }
  function buildTimestamp() {
    const d = new Date();
    const p2 = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + '-' +
           p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
  }
  function triggerBlobDownload(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  }

  /* ================= 一键下载全部条码 ZIP ================= */
  function validateAscii(text) {
    if (!text.length) return false;
    for (let i = 0; i < text.length; i++) {
      const c = text.charCodeAt(i);
      if (c < 32 || c > 126) return false;
    }
    return true;
  }

  async function downloadAllBarcodes() {
    syncNormalFromDOM();

    const allLines = getNormalLines();
    if (!allLines.length) {
      alert('请先在左侧输入至少一行条码内容');
      return;
    }
    const lines = allLines.slice(0, MAX_LINES);
    if (allLines.length > MAX_LINES) {
      alert('条码数量超过 ' + MAX_LINES + ' 个，将只导出前 ' + MAX_LINES + ' 个');
    }

    const bad = [];
    lines.forEach(function (l, i) {
      if (!validateAscii(l)) bad.push(i + 1);
    });
    if (bad.length) {
      const shown = bad.slice(0, 10).join('、');
      alert('以下行包含不支持的字符（仅支持 ASCII 可见字符），请修改后重试：\n第 ' + shown +
            (bad.length > 10 ? ' 等 ' + bad.length + ' 行' : ' 行'));
      return;
    }

    const cfg = getNormalConfig();
    const textHmm = cfg.showText ? TEXT_H : 0;
    const barHmm = cfg.heightMode === 'fixed' ? cfg.fixedHeight : ZIP_DEFAULT_BAR_H;
    const contentW = Math.max(5, PAGE_W - cfg.padLeft - cfg.padRight);
    const barcodeWmm = Math.max(20, contentW * cfg.widthPct / 100);

    const W = Math.max(60, Math.round(barcodeWmm * ZIP_DPI));
    const HB = Math.max(20, Math.round(barHmm * ZIP_DPI));
    const HT = Math.round(textHmm * ZIP_DPI);

    const btn = downloadZipBtn;
    const originalText = btn.textContent;
    btn.disabled = true;

    try {
      const files = [];
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        btn.textContent = '生成中 ' + (i + 1) + ' / ' + lines.length;

        if (i > 0 && i % 5 === 0) {
          await new Promise(function (r) { setTimeout(r, 0); });
        }

        const fontMM = cfg.showText ? pickFontMM(line, barcodeWmm, textHmm) : 0;
        const fontPx = fontMM * ZIP_DPI;
        const svg = buildSVG(line, W, HB, HT, fontPx, '');
        const blob = await svgToPngBlob(svg, W, HB + HT);
        const data = new Uint8Array(await blob.arrayBuffer());

        files.push({
          name: padSeq(i + 1) + '_' + safeFileName(line) + '.png',
          data: data
        });
      }

      btn.textContent = '打包中…';
      await new Promise(function (r) { setTimeout(r, 0); });

      const zipBlob = buildZip(files);
      const zipName = '条形码_' + buildTimestamp() + '_' + files.length + '.zip';
      triggerBlobDownload(zipBlob, zipName);
    } catch (err) {
      alert('导出失败：' + (err && err.message ? err.message : '未知错误'));
    } finally {
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  /* ================= 普通模式配置与布局 ================= */
  function getNormalConfig() {
    const n = state.normal;
    return {
      perPage: Math.round(clampNum(n.perPage, 1, 20, 6)),
      widthPct: clampNum(n.widthPct, 20, 100, 100),
      heightMode: n.heightMode === 'fixed' ? 'fixed' : 'auto',
      fixedHeight: clampNum(n.fixedHeight, 3, 120, 22),
      singleBarH: clampNum(n.singleBarH, 3, 120, 22),
      showText: !!n.showText,
      padTop: clampNum(n.padTop, 0, 80, 10),
      padBottom: clampNum(n.padBottom, 0, 80, 3),
      padLeft: clampNum(n.padLeft, 0, 40, 2),
      padRight: clampNum(n.padRight, 0, 40, 2),
      gap: clampNum(n.gap, 0, 40, 1.5),
      zoom: clampNum(n.zoom, 0.5, 3, 1.5)
    };
  }

  function getNormalLines() {
    return state.normal.input.split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function computeNormalLayout(cfg, n) {
    const contentW = Math.max(5, PAGE_W - cfg.padLeft - cfg.padRight);
    const contentH = Math.max(5, PAGE_H - cfg.padTop - cfg.padBottom);
    const textH = cfg.showText ? TEXT_H : 0;

    let barH, unitH, overflow = false;

    if (cfg.heightMode === 'auto') {
      const raw = (contentH - cfg.gap * (n - 1)) / n;
      barH = Math.max(3, raw - textH);
      unitH = barH + textH;
      if (unitH * n + cfg.gap * (n - 1) > contentH + 0.001) overflow = true;
    } else {
      barH = Math.max(3, cfg.fixedHeight);
      unitH = barH + textH;
      const need = unitH * n + cfg.gap * (n - 1);
      if (need > contentH) {
        const avail = Math.max(2, contentH - cfg.gap * (n - 1));
        barH = Math.max(2, (avail / n) - textH);
        unitH = barH + textH;
        overflow = true;
      }
    }
    return { contentW, contentH, barH, unitH, textH, overflow };
  }

  function computeSingleLayout(cfg) {
    const base = computeNormalLayout(cfg, 1);
    const textH = cfg.showText ? TEXT_H : 0;
    const barH = Math.max(3, cfg.singleBarH);
    const unitH = barH + textH;
    const overflow = unitH > base.contentH + 0.001;
    return {
      contentW: base.contentW,
      contentH: base.contentH,
      barH: barH,
      unitH: unitH,
      textH: textH,
      overflow: overflow
    };
  }

  function pickFontMM(text, barcodeW, textH) {
    if (textH <= 0) return 0;
    const byWidth = (barcodeW - 1.2) / Math.max(1, text.length * 0.62);
    return Math.max(1.0, Math.min(textH * 0.74, byWidth, 3.4));
  }

  /* ================= 快递单配置与布局 ================= */
  function getExpressConfig() {
    const n = state.normal;
    const x = state.express;
    return {
      barH: clampNum(x.barH, 4, 60, 12),
      widthPct: clampNum(x.widthPct, 30, 100, 100),
      vBarW: clampNum(x.vBarW, 6, 36, 12),
      vBarTop: clampNum(x.vBarTop, 0, 60, 0),
      vBarH: clampNum(x.vBarH, 0, 120, 0),
      showText: x.showText !== false,
      showVBarcode: x.showVBarcode !== false,
      showVText: x.showVText !== false,
      padTop: clampNum(n.padTop, 0, 80, 10),
      padBottom: clampNum(n.padBottom, 0, 80, 3),
      padLeft: clampNum(n.padLeft, 0, 40, 2),
      padRight: clampNum(n.padRight, 0, 40, 2),
      gap: clampNum(n.gap, 0, 40, 1.5),
      zoom: clampNum(n.zoom, 0.5, 3, 1.5)
    };
  }

  function computeExpressLayout(cfg) {
    const contentW = Math.max(5, PAGE_W - cfg.padLeft - cfg.padRight);
    const contentH = Math.max(5, PAGE_H - cfg.padTop - cfg.padBottom);
    const textH = cfg.showText ? TEXT_H : 0;
    const topH = cfg.barH + textH;
    const midH = Math.max(3, contentH - topH - cfg.gap);

    const vTextW = (cfg.showVBarcode && cfg.showVText) ? TEXT_H : 0;
    const vbTotalW = cfg.showVBarcode ? (cfg.vBarW + vTextW) : 0;
    const reserveW = cfg.showVBarcode ? (vbTotalW + cfg.gap) : 0;
    const contentAreaW = Math.max(4, contentW - reserveW);

    const maxTop = Math.max(0, midH - 8);
    const vBarTop = cfg.showVBarcode ? Math.min(cfg.vBarTop, maxTop) : 0;
    const availH = Math.max(4, midH - vBarTop);
    let vBarH = availH;
    if (cfg.showVBarcode && cfg.vBarH > 0) {
      vBarH = Math.min(cfg.vBarH, availH);
    }

    return {
      contentW,
      contentH,
      topH,
      midH,
      vTextW,
      vbTotalW,
      contentAreaW,
      contentAreaH: midH,
      vBarTop,
      vBarH
    };
  }

  function fitExpressFontMM(content, areaW, areaH) {
    if (!content) return 3.2;
    let fs = 3.4;
    while (fs > 1.7) {
      const lineH = fs * 1.5;
      let lines = 0;
      content.split('\n').forEach(function (seg) {
        const cpl = Math.max(1, Math.floor((areaW - 0.5) / (fs * 0.62)));
        lines += Math.max(1, Math.ceil(seg.length / cpl));
      });
      if (lines * lineH <= areaH) return fs;
      fs -= 0.15;
    }
    return 1.7;
  }

  function pickVerticalFontMM(text, heightMM, textWMM) {
    if (textWMM <= 0 || !text) return 0;
    const byHeight = (heightMM - 1) / Math.max(1, text.length * 0.62);
    const byWidth = textWMM * 0.72;
    return Math.max(1.0, Math.min(byWidth, byHeight, 3.2));
  }

  /* ================= 快递单子标签切换 ================= */
  function renderExpressSubTabs() {
    const sub = state.express.subTab === 'settings' ? 'settings' : 'content';

    expressSettingsPanel.hidden = sub !== 'settings';
  }

  /* ================= 普通模式：构建一张面单 ================= */
  function buildNormalPaper(cfg, layout, chunk, u, barcodeWMM) {
    const paper = el('div', 'paper');
    paper.style.width = (PAGE_W * u).toFixed(2) + 'px';
    paper.style.height = (PAGE_H * u).toFixed(2) + 'px';

    if (cfg.padTop > 0) {
      const guide = el('div', 'guide-top');
      guide.style.height = (cfg.padTop * u).toFixed(2) + 'px';
      guide.textContent = '厂商图标区 ' + cfg.padTop + 'mm';
      paper.appendChild(guide);
    }

    const body = el('div', 'paper-body');
    body.style.padding =
      (cfg.padTop * u).toFixed(2) + 'px ' +
      (cfg.padRight * u).toFixed(2) + 'px ' +
      (cfg.padBottom * u).toFixed(2) + 'px ' +
      (cfg.padLeft * u).toFixed(2) + 'px';
    body.style.gap = (cfg.gap * u).toFixed(2) + 'px';
    body.style.justifyContent = 'flex-start';

    chunk.forEach(function (line) {
      const item = el('div', 'paper-item');
      item.style.height = (layout.unitH * u).toFixed(2) + 'px';

      let svg = null;
      try {
        const fontMM = pickFontMM(line, barcodeWMM, layout.textH);
        svg = buildSVG(line, barcodeWMM * u, layout.barH * u, layout.textH * u, fontMM * u, '');
        item.appendChild(svg);
      } catch (err) {
        const e = el('div', 'paper-err');
        e.textContent = '内容无效：' + err.message;
        item.appendChild(e);
      }

      if (svg) {
        const dl = document.createElement('button');
        dl.className = 'dl-btn';
        dl.type = 'button';
        dl.textContent = '⬇ PNG';
        dl.addEventListener('click', function (ev) {
          ev.stopPropagation();
          downloadPNG(svg, line);
        });
        item.appendChild(dl);
      }
      body.appendChild(item);
    });

    paper.appendChild(body);
    return paper;
  }

  /* ================= 普通模式：列表预览 ================= */
  function renderNormalListPreview(cfg, allLines) {
    const lines = allLines.slice(0, MAX_LINES);
    const layout = computeNormalLayout(cfg, cfg.perPage);

    const msgs = [];
    if (cfg.padTop + cfg.padBottom > PAGE_H - 12) msgs.push('上下边距之和过大，可用高度不足。');
    if (layout.overflow) msgs.push('条码总高度超出可用区域，已自动压缩，建议减小条码高度或每页数量。');
    if (layout.barH < 6) msgs.push('当前条码高度仅 ' + layout.barH.toFixed(1) + ' mm，可能影响扫描识别。');
    if (allLines.length > MAX_LINES) msgs.push('条码数量超过 ' + MAX_LINES + ' 个，仅显示前 ' + MAX_LINES + ' 个。');
    if (msgs.length) { warnEl.textContent = msgs.join(' '); warnEl.hidden = false; }
    else warnEl.hidden = true;

    zoomValEl.textContent = Math.round(cfg.zoom * 100) + '%';
    previewTitle.innerHTML = '打印预览 · 普通模式 · 列表 · 纸张 <b>76 × 130 mm</b>（7.6cm × 13cm）';

    previewPages.innerHTML = '';
    if (!lines.length) {
      previewPages.innerHTML = '<div class="empty-tip">在左侧输入条码内容，每行一个，右侧即实时预览</div>';
      return;
    }

    const u = PX_PER_MM * cfg.zoom;
    const allPages = chunkArray(lines, cfg.perPage);
    const pages = allPages.slice(0, PREVIEW_MAX_PAGES);
    const barcodeWMM = layout.contentW * cfg.widthPct / 100;
    const frag = document.createDocumentFragment();

    pages.forEach(function (chunk, pi) {
      const wrap = el('div', 'paper-wrap');
      const cap = el('div', 'paper-cap');
      cap.textContent = '第 ' + (pi + 1) + ' / ' + allPages.length + ' 张 · 76 × 130 mm';
      wrap.appendChild(cap);
      wrap.appendChild(buildNormalPaper(cfg, layout, chunk, u, barcodeWMM));
      frag.appendChild(wrap);
    });

    previewPages.appendChild(frag);

    if (allPages.length > PREVIEW_MAX_PAGES) {
      const more = el('div', 'page-more');
      more.textContent = '为保持流畅，预览仅显示前 ' + PREVIEW_MAX_PAGES + ' 页，打印时会输出全部 ' + allPages.length + ' 页';
      previewPages.appendChild(more);
    }
  }

  /* ================= 普通模式：单条翻阅预览 ================= */
  function renderNormalSinglePreview(cfg, allLines) {
    const lines = allLines.slice(0, MAX_LINES);
    const total = lines.length;

    const layout = computeSingleLayout(cfg);

    const msgs = [];
    if (cfg.padTop + cfg.padBottom > PAGE_H - 12) msgs.push('上下边距之和过大，可用高度不足。');
    if (layout.overflow) msgs.push('条码高度 ' + layout.barH.toFixed(1) + ' mm 超出可用区域，建议减小单条翻阅高度或上下边距。');
    if (layout.barH < 6) msgs.push('当前条码高度仅 ' + layout.barH.toFixed(1) + ' mm，可能影响扫描识别。');
    if (allLines.length > MAX_LINES) msgs.push('条码数量超过 ' + MAX_LINES + ' 个，仅显示前 ' + MAX_LINES + ' 个。');
    if (msgs.length) { warnEl.textContent = msgs.join(' '); warnEl.hidden = false; }
    else warnEl.hidden = true;

    zoomValEl.textContent = Math.round(cfg.zoom * 100) + '%';
    previewTitle.innerHTML = '打印预览 · 普通模式 · 单条翻阅（高度 ' + layout.barH.toFixed(1) +
      ' mm）· 纸张 <b>76 × 130 mm</b>（7.6cm × 13cm）';

    previewPages.innerHTML = '';
    if (!total) {
      previewPages.innerHTML = '<div class="empty-tip">在左侧输入条码内容，每行一个，右侧即实时预览</div>';
      return;
    }

    let idx = state.normal.singleIndex || 0;
    if (idx >= total) idx = total - 1;
    if (idx < 0) idx = 0;
    state.normal.singleIndex = idx;

    const u = PX_PER_MM * cfg.zoom;
    const barcodeWMM = layout.contentW * cfg.widthPct / 100;

    const wrap = el('div', 'paper-wrap');

    const nav = el('div', 'single-nav');
    const prev = document.createElement('button');
    prev.type = 'button';
    prev.textContent = '‹';
    prev.title = '上一个（←）';
    prev.disabled = idx <= 0;
    prev.addEventListener('click', function () { changeSingleIndex(-1); });

    const counter = el('span', 'counter');
    counter.textContent = '第 ' + (idx + 1) + ' / ' + total + ' 个';

    const next = document.createElement('button');
    next.type = 'button';
    next.textContent = '›';
    next.title = '下一个（→）';
    next.disabled = idx >= total - 1;
    next.addEventListener('click', function () { changeSingleIndex(1); });

    nav.appendChild(prev);
    nav.appendChild(counter);
    nav.appendChild(next);
    wrap.appendChild(nav);

    wrap.appendChild(buildNormalPaper(cfg, layout, [lines[idx]], u, barcodeWMM));

    previewPages.appendChild(wrap);
  }

  function changeSingleIndex(delta) {
    if (state.mode !== 'normal' || state.normal.previewMode !== 'single') return;
    const total = Math.min(getNormalLines().length, MAX_LINES);
    if (total <= 0) return;
    let idx = (state.normal.singleIndex || 0) + delta;
    idx = Math.max(0, Math.min(total - 1, idx));
    if (idx !== state.normal.singleIndex) {
      state.normal.singleIndex = idx;
      renderPreview();
      scheduleSave();
    }
  }

  /* ================= 普通模式预览入口 ================= */
  function renderNormalPreview() {
    const cfg = getNormalConfig();
    const allLines = getNormalLines();
    if (state.normal.previewMode === 'single') {
      renderNormalSinglePreview(cfg, allLines);
    } else {
      renderNormalListPreview(cfg, allLines);
    }
  }

  /* ================= 快递单预览 ================= */
  function renderExpressPreview() {
    const cfg = getExpressConfig();
    const layout = computeExpressLayout(cfg);
    const pages = state.express.pages;

    const msgs = [];
    if (cfg.padTop + cfg.padBottom > PAGE_H - 20) msgs.push('上下边距之和过大，可用高度不足。');
    if (layout.midH < 10) msgs.push('中间区域高度不足，请减小横条码高度或边距。');
    if (layout.contentAreaW < 15) msgs.push('内容区宽度不足，请减小竖条码宽度或左右边距。');
    if (cfg.showVBarcode) {
      const maxTop = Math.max(0, layout.midH - 8);
      if (cfg.vBarTop > maxTop) msgs.push('竖条码上边距超出可用高度，已自动压缩。');
      if (cfg.vBarH > 0 && cfg.vBarH > layout.midH - layout.vBarTop) msgs.push('竖条码长度超出剩余高度，已自动压缩。');
    }
    pages.forEach(function (p, i) {
      if (!p.barcode.trim()) msgs.push('第 ' + (i + 1) + ' 页条码内容为空。');
    });
    if (msgs.length) { warnExpress.textContent = msgs.join(' '); warnExpress.hidden = false; }
    else warnExpress.hidden = true;

    zoomValEl.textContent = Math.round(cfg.zoom * 100) + '%';
    previewTitle.innerHTML = '打印预览 · 快递单模式 · 纸张 <b>76 × 130 mm</b>（7.6cm × 13cm）';

    previewPages.innerHTML = '';
    if (!pages.length) {
      previewPages.innerHTML = '<div class="empty-tip">请添加至少一页快递单</div>';
      return;
    }

    const u = PX_PER_MM * cfg.zoom;
    const frag = document.createDocumentFragment();

    pages.forEach(function (page, pi) {
      const wrap = el('div', 'paper-wrap');
      const cap = el('div', 'paper-cap');
      cap.textContent = '第 ' + (pi + 1) + ' / ' + pages.length + ' 张 · 76 × 130 mm';
      wrap.appendChild(cap);

      const paper = el('div', 'paper');
      paper.style.width = (PAGE_W * u).toFixed(2) + 'px';
      paper.style.height = (PAGE_H * u).toFixed(2) + 'px';

      if (cfg.padTop > 0) {
        const guide = el('div', 'guide-top');
        guide.style.height = (cfg.padTop * u).toFixed(2) + 'px';
        guide.textContent = '厂商图标区 ' + cfg.padTop + 'mm';
        paper.appendChild(guide);
      }

      const body = el('div', 'paper-body express-body');
      body.style.padding =
        (cfg.padTop * u).toFixed(2) + 'px ' +
        (cfg.padRight * u).toFixed(2) + 'px ' +
        (cfg.padBottom * u).toFixed(2) + 'px ' +
        (cfg.padLeft * u).toFixed(2) + 'px';

      const top = el('div', 'express-top-barcode');
      top.style.height = (layout.topH * u).toFixed(2) + 'px';
      const bc = (page.barcode || '').trim();
      try {
        if (!bc) throw new Error('内容为空');
        const barcodeWMM = layout.contentW * cfg.widthPct / 100;
        const fontMM = cfg.showText ? pickFontMM(bc, barcodeWMM, TEXT_H) : 0;
        const textH = cfg.showText ? TEXT_H : 0;
        top.appendChild(buildSVG(bc, barcodeWMM * u, cfg.barH * u, textH * u, fontMM * u, ''));
      } catch (err) {
        const e = el('div', 'express-err');
        e.textContent = '条码无效：' + err.message;
        top.appendChild(e);
      }
      body.appendChild(top);

      const main = el('div', 'express-main');
      main.style.marginTop = (cfg.gap * u).toFixed(2) + 'px';
      main.style.height = (layout.midH * u).toFixed(2) + 'px';

      const content = el('div', 'express-content');
      const fsMM = fitExpressFontMM(page.content || '', layout.contentAreaW, layout.contentAreaH);
      content.style.fontSize = (fsMM * u).toFixed(2) + 'px';
      content.style.lineHeight = '1.5';
      content.textContent = page.content || '';
      main.appendChild(content);

      if (cfg.showVBarcode) {
        const vb = el('div', 'express-vbarcode');
        vb.style.width = (layout.vbTotalW * u).toFixed(2) + 'px';
        vb.style.height = (layout.vBarH * u).toFixed(2) + 'px';
        vb.style.marginTop = (layout.vBarTop * u).toFixed(2) + 'px';
        vb.style.marginLeft = (cfg.gap * u).toFixed(2) + 'px';
        // 优先使用高级选项中的纵向条码内容，留空则与横条码一致
        const vText = (page.vBarcode || '').trim() || bc;
        try {
          if (!vText) throw new Error('内容为空');
          const vFontMM = cfg.showVText ? pickVerticalFontMM(vText, layout.vBarH, layout.vTextW) : 0;
          vb.appendChild(buildVerticalSVG(
            vText,
            cfg.vBarW * u,
            layout.vBarH * u,
            layout.vTextW * u,
            vFontMM * u,
            cfg.showVText,
            ''
          ));
        } catch (err) {
          const e = el('div', 'express-err');
          e.textContent = '竖条码无效：' + err.message;
          vb.appendChild(e);
        }
        main.appendChild(vb);
      }

      body.appendChild(main);

      paper.appendChild(body);
      wrap.appendChild(paper);
      frag.appendChild(wrap);
    });

    previewPages.appendChild(frag);
  }

  /* ================= 预览入口 ================= */
  function renderPreview() {
    if (state.mode === 'express') renderExpressPreview();
    else renderNormalPreview();
  }

  let renderTimer = null;
  function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderPreview, 110);
  }

  /* ================= 普通模式打印 ================= */
  function buildNormalPrintDOM() {
    const cfg = getNormalConfig();
    const lines = getNormalLines().slice(0, MAX_LINES);

    printRoot.innerHTML = '';
    if (!lines.length) {
      alert('请先在左侧输入至少一行条码内容');
      return false;
    }

    const layout = computeNormalLayout(cfg, cfg.perPage);
    const pages = chunkArray(lines, cfg.perPage);
    const barcodeWMM = layout.contentW * cfg.widthPct / 100;
    const frag = document.createDocumentFragment();

    pages.forEach(function (chunk) {
      const page = el('div', 'label-page');
      const body = el('div', 'label-body');
      body.style.padding =
        cfg.padTop + 'mm ' + cfg.padRight + 'mm ' +
        cfg.padBottom + 'mm ' + cfg.padLeft + 'mm';
      body.style.gap = cfg.gap + 'mm';
      body.style.justifyContent = 'flex-start';

      chunk.forEach(function (line) {
        const item = el('div', 'label-item');
        item.style.height = layout.unitH.toFixed(3) + 'mm';
        try {
          const fontMM = pickFontMM(line, barcodeWMM, layout.textH);
          item.appendChild(buildSVG(line, barcodeWMM, layout.barH, layout.textH, fontMM, 'mm'));
        } catch (err) {
          const d = el('div', 'print-err');
          d.textContent = line + '：' + err.message;
          item.appendChild(d);
        }
        body.appendChild(item);
      });

      page.appendChild(body);
      frag.appendChild(page);
    });

    printRoot.appendChild(frag);
    return true;
  }

  /* ================= 快递单打印 ================= */
  function buildExpressPrintDOM() {
    const cfg = getExpressConfig();
    const layout = computeExpressLayout(cfg);
    const pages = state.express.pages;

    printRoot.innerHTML = '';
    if (!pages.length) {
      alert('请至少添加一页快递单');
      return false;
    }

    const frag = document.createDocumentFragment();

    pages.forEach(function (page) {
      const pageEl = el('div', 'label-page');
      const label = el('div', 'express-label');
      label.style.padding =
        cfg.padTop + 'mm ' + cfg.padRight + 'mm ' +
        cfg.padBottom + 'mm ' + cfg.padLeft + 'mm';

      const body = el('div', 'express-body');

      const top = el('div', 'express-top-barcode');
      top.style.height = layout.topH.toFixed(3) + 'mm';
      const bc = (page.barcode || '').trim();
      try {
        if (!bc) throw new Error('内容为空');
        const barcodeWMM = layout.contentW * cfg.widthPct / 100;
        const fontMM = cfg.showText ? pickFontMM(bc, barcodeWMM, TEXT_H) : 0;
        const textH = cfg.showText ? TEXT_H : 0;
        top.appendChild(buildSVG(bc, barcodeWMM, cfg.barH, textH, fontMM, 'mm'));
      } catch (err) {
        const e = el('div', 'print-err');
        e.textContent = '条码无效：' + err.message;
        top.appendChild(e);
      }
      body.appendChild(top);

      const main = el('div', 'express-main');
      main.style.marginTop = cfg.gap + 'mm';
      main.style.height = layout.midH.toFixed(3) + 'mm';

      const content = el('div', 'express-content');
      const fsMM = fitExpressFontMM(page.content || '', layout.contentAreaW, layout.contentAreaH);
      content.style.fontSize = fsMM.toFixed(2) + 'mm';
      content.style.lineHeight = '1.5';
      content.textContent = page.content || '';
      main.appendChild(content);

      if (cfg.showVBarcode) {
        const vb = el('div', 'express-vbarcode');
        vb.style.width = layout.vbTotalW + 'mm';
        vb.style.height = layout.vBarH.toFixed(3) + 'mm';
        vb.style.marginTop = layout.vBarTop.toFixed(3) + 'mm';
        vb.style.marginLeft = cfg.gap + 'mm';
        const vText = (page.vBarcode || '').trim() || bc;
        try {
          if (!vText) throw new Error('内容为空');
          const vFontMM = cfg.showVText ? pickVerticalFontMM(vText, layout.vBarH, layout.vTextW) : 0;
          vb.appendChild(buildVerticalSVG(
            vText,
            cfg.vBarW,
            layout.vBarH,
            layout.vTextW,
            vFontMM,
            cfg.showVText,
            'mm'
          ));
        } catch (err) {
          const e = el('div', 'print-err');
          e.textContent = '竖条码无效：' + err.message;
          vb.appendChild(e);
        }
        main.appendChild(vb);
      }

      body.appendChild(main);
      label.appendChild(body);
      pageEl.appendChild(label);
      frag.appendChild(pageEl);
    });

    printRoot.appendChild(frag);
    return true;
  }

  function printAll() {
    syncNormalFromDOM();
    let ok = false;
    if (state.mode === 'express') ok = buildExpressPrintDOM();
    else ok = buildNormalPrintDOM();
    if (!ok) return;
    requestAnimationFrame(function () {
      setTimeout(function () { window.print(); }, 30);
    });
  }

  /* ================= 模式切换 ================= */
  function applyModeUI() {
    const isExpress = state.mode === 'express';
    normalPanel.hidden = isExpress;
    expressPanel.hidden = !isExpress;
    $('modeNormal').classList.toggle('active', !isExpress);
    $('modeExpress').classList.toggle('active', isExpress);
    viewSwitch.hidden = isExpress;
  }

  function switchMode(mode) {
    if (mode !== 'express' && mode !== 'normal') return;
    if (state.mode === mode) return;
    syncNormalFromDOM();
    state.mode = mode;
    applyModeUI();
    applyExpressToDOM();
    syncPaddingInputs();
    renderPreview();
    doSave();
  }

  /* ================= 事件：普通面板 ================= */
  normalPanel.addEventListener('input', function (e) {
    if (e.target === heightModeEl) {
      fixedHEl.disabled = (heightModeEl.value !== 'fixed');
    }
    syncNormalFromDOM();
    syncPaddingInputs();
    scheduleRender();
    scheduleSave();
  });
  normalPanel.addEventListener('change', function (e) {
    if (e.target === heightModeEl) {
      fixedHEl.disabled = (heightModeEl.value !== 'fixed');
    }
    syncNormalFromDOM();
    syncPaddingInputs();
    scheduleRender();
    scheduleSave();
  });

  /* ================= 事件：快递单子标签 ================= */
  expressSubTabs.addEventListener('click', function (e) {
    const btn = e.target.closest('.sub-tab');
    if (!btn) return;
    const sub = btn.dataset.subtab;
    if (sub !== 'content' && sub !== 'settings') return;
    if (state.express.subTab === sub) return;
    state.express.subTab = sub;
    renderExpressSubTabs();
    doSave();
  });

  /* ================= 事件：快递单面板 ================= */
  expressPanel.addEventListener('input', function (e) {
    const t = e.target;

    // 页编辑区 / 高级选项中的内容字段
    if (t.dataset && t.dataset.field) {
      const page = state.express.pages[state.express.currentPage];
      if (!page) return;
      page[t.dataset.field] = t.value;
      scheduleRender();
      scheduleSave();
      return;
    }

    // 设置项
    if (t.id === 'exBarH') state.express.barH = t.value;
    else if (t.id === 'exWidthPct') state.express.widthPct = t.value;
    else if (t.id === 'exVBarW') state.express.vBarW = t.value;
    else if (t.id === 'exVBarTop') state.express.vBarTop = t.value;
    else if (t.id === 'exVBarH') state.express.vBarH = t.value;
    else if (t.id === 'exShowText') state.express.showText = t.checked;
    else if (t.id === 'exShowVBarcode') {
      state.express.showVBarcode = t.checked;
      syncVTextAvailability();
    }
    else if (t.id === 'exShowVText') state.express.showVText = t.checked;
    else if (t.id === 'exPadTop') state.normal.padTop = t.value;
    else if (t.id === 'exPadBottom') state.normal.padBottom = t.value;
    else if (t.id === 'exPadLeft') state.normal.padLeft = t.value;
    else if (t.id === 'exPadRight') state.normal.padRight = t.value;
    else if (t.id === 'exGap') state.normal.gap = t.value;

    if ((t.id && t.id.indexOf('exPad') === 0) || t.id === 'exGap') {
      syncPaddingInputs();
    }

    scheduleRender();
    scheduleSave();
  });
  expressPanel.addEventListener('change', function (e) {
    const t = e.target;
    if (t.id === 'exShowText') state.express.showText = t.checked;
    else if (t.id === 'exShowVBarcode') {
      state.express.showVBarcode = t.checked;
      syncVTextAvailability();
    }
    else if (t.id === 'exShowVText') state.express.showVText = t.checked;
    scheduleRender();
    scheduleSave();
  });

  /* --- 页标签栏：切换 / 添加 --- */
  pageTabs.addEventListener('click', function (e) {
    const addBtn = e.target.closest('button[data-action="add"]');
    if (addBtn) {
      state.express.pages.push({ barcode: '', vBarcode: '', content: '' });
      state.express.currentPage = state.express.pages.length - 1;
      renderExpressPageEditor();
      renderPreview();
      scheduleSave();
      setTimeout(function () {
        const inp = pageEditor.querySelector('input[data-field="barcode"]');
        if (inp) inp.focus();
      }, 30);
      return;
    }
    const tab = e.target.closest('.page-tab');
    if (!tab) return;
    const idx = parseInt(tab.dataset.index, 10);
    if (isNaN(idx) || idx === state.express.currentPage) return;
    state.express.currentPage = idx;
    renderExpressPageEditor();
    doSave();
  });

  /* --- 编辑区删除按钮 --- */
  pageEditor.addEventListener('click', function (e) {
    const btn = e.target.closest('button[data-action="del"]');
    if (!btn) return;
    if (state.express.pages.length <= 1) return;
    const cur = state.express.currentPage;
    state.express.pages.splice(cur, 1);
    if (state.express.currentPage >= state.express.pages.length) {
      state.express.currentPage = state.express.pages.length - 1;
    }
    renderExpressPageEditor();
    renderPreview();
    scheduleSave();
  });

  /* ================= 视图切换 ================= */
  viewSwitch.addEventListener('click', function (e) {
    const btn = e.target.closest('.view-btn');
    if (!btn) return;
    const view = btn.dataset.view;
    if (view !== 'list' && view !== 'single') return;
    if (state.normal.previewMode === view) return;
    state.normal.previewMode = view;
    updateViewSwitchUI();
    renderPreview();
    doSave();
  });

  document.addEventListener('keydown', function (e) {
    if (state.mode !== 'normal' || state.normal.previewMode !== 'single') return;
    const t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT')) return;
    if (e.key === 'ArrowLeft') {
      e.preventDefault();
      changeSingleIndex(-1);
    } else if (e.key === 'ArrowRight') {
      e.preventDefault();
      changeSingleIndex(1);
    }
  });

  /* ================= 缩放 ================= */
  zoomEl.addEventListener('input', function () {
    state.normal.zoom = zoomEl.value;
    zoomValEl.textContent = Math.round(parseFloat(zoomEl.value) * 100) + '%';
    scheduleRender();
    scheduleSave();
  });

  /* ================= 按钮 ================= */
  $('printAll').addEventListener('click', printAll);
  $('exPrintAll').addEventListener('click', printAll);
  downloadZipBtn.addEventListener('click', downloadAllBarcodes);

  $('reset').addEventListener('click', function () {
    state.normal = clone(DEFAULT_NORMAL);
    applyNormalToDOM();
    applyExpressToDOM();
    syncPaddingInputs();
    updateViewSwitchUI();
    renderPreview();
    scheduleSave();
  });

  $('exReset').addEventListener('click', function () {
    state.express = clone(DEFAULT_EXPRESS);
    applyExpressToDOM();
    renderPreview();
    scheduleSave();
  });

  $('modeNormal').addEventListener('click', function () { switchMode('normal'); });
  $('modeExpress').addEventListener('click', function () { switchMode('express'); });

  inputEl.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      printAll();
    }
  });

  window.addEventListener('beforeunload', function () {
    clearTimeout(saveTimer);
    syncNormalFromDOM();
    doSave();
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') {
      clearTimeout(saveTimer);
      syncNormalFromDOM();
      doSave();
    }
  });

  /* ================= 初始化 ================= */
  const restored = loadState();

  if (!restored) {
    state.normal = clone(DEFAULT_NORMAL);
    state.express = clone(DEFAULT_EXPRESS);
    state.mode = 'normal';
  }

  applyNormalToDOM();
  applyExpressToDOM();
  syncPaddingInputs();
  fixedHEl.disabled = (heightModeEl.value !== 'fixed');
  zoomValEl.textContent = Math.round(parseFloat(zoomEl.value || 1.5) * 100) + '%';

  updateViewSwitchUI();
  applyModeUI();
  renderExpressSubTabs();
  renderExpressPageEditor();
  renderPreview();

  if (restored) {
    saveDot.classList.remove('pending');
    saveText.textContent = '已恢复上次的内容与设置';
    setTimeout(function () {
      saveText.textContent = '内容与设置已自动保存在本地浏览器';
    }, 2400);
  } else {
    scheduleSave();
  }
})();
</script>
</body>
</html>
